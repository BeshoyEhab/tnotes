[project]
name = "tnotes"
version = "0.1.0"
description = "Terminal notepad with actions (tn)"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tn = "tnotes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tnotes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
