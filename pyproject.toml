[project]
name = "tnotes"
version = "0.1.0"
description = "Terminal notepad with actions (tn)"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["textual>=0.86"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
tn = "tnotes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tnotes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
